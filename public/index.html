<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Fotoflow -->
    <!-- From the house of Monalisa and Apeiro -->
    <!-- Made with ❤️ from Kochi, India -->

    <meta charset="utf-8" />
    <script>
      // Canonical domain redirect: legacy Firebase default domains
      // (fotoflow-studio.web.app / *.firebaseapp.com) → https://app.fotoflow.co
      // Gallery routes are 301'd server-side by serveGallery; this covers all
      // other SPA routes that serve index.html directly. Preserves path+query.
      (function () {
        try {
          var host = window.location.hostname.toLowerCase();
          var isLegacy =
            host === 'fotoflow-studio.web.app' ||
            host === 'fotoflow-studio.firebaseapp.com' ||
            host === 'fotoflow-cloud.web.app' ||
            host === 'fotoflow-cloud.firebaseapp.com' ||
            (/\.web\.app$/.test(host)) ||
            (/\.firebaseapp\.com$/.test(host));
          if (isLegacy) {
            var target =
              'https://app.fotoflow.co' +
              window.location.pathname +
              window.location.search +
              window.location.hash;
            window.location.replace(target);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="%PUBLIC_URL%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <!-- SSR Meta Placeholders -->
    <title>Fotoflow</title>
    <meta name="description" content="__DESCRIPTION__" data-rh="true"/>
    <meta property="og:title" content="Fotoflow" />
    <meta property="og:description" content="__DESCRIPTION__" />
    <meta property="og:image" content="__IMAGE__" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fotoflow" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__IMAGE__" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
